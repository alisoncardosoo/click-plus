name: ClickPlus
options:
  developmentLanguage: pt-BR
  bundleIdPrefix: br.com.clickplus
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_OBJC_BRIDGING_HEADER: ClickPlus/Support/MultitouchTypes.h
    CODE_SIGN_IDENTITY: 'Apple Development'
    DEVELOPMENT_TEAM: A4DR63XYGA
    CODE_SIGN_STYLE: Manual
    ENABLE_APP_SANDBOX: NO
    MACOSX_DEPLOYMENT_TARGET: '14.0'
targets:
  ClickPlus:
    type: application
    platform: macOS
    sources: [ClickPlus]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.ratoesperto.app
        PRODUCT_NAME: Click +
        PRODUCT_MODULE_NAME: ClickPlus
        EXECUTABLE_NAME: ClickPlus
        INFOPLIST_KEY_CFBundleName: Click +
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDevelopmentRegion: pt_BR
        INFOPLIST_KEY_CFBundleDisplayName: Click +
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSInputMonitoringUsageDescription: Identificar os eventos do seu mouse sem alterar o trackpad.
    scheme:
      testTargets: [ClickPlusTests]
  ClickPlusTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: ClickPlus
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Click +.app/Contents/MacOS/ClickPlus"
        BUNDLE_LOADER: "$(TEST_HOST)"
